<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cars World — Owner Dashboard</title><link rel="stylesheet" href="style.css"><style>
body{overflow:auto;background:#081322}.dash{max-width:1100px;margin:40px auto;padding:18px}.card{background:#0b1b31;border:1px solid #ffffff25;border-radius:14px;padding:18px;margin:12px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.metric{flex:1;min-width:160px}.metric b{font-size:30px;color:#55eaff}.metric small{display:block;color:#9bb2cf}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff1a;font-size:13px}th{color:#55eaff}input{max-width:350px}.online{color:#75f0ac}
</style></head><body><main class="dash"><div class="logo">WELCOME TO <span>CARS WORLD</span></div><h2>OWNER DASHBOARD</h2><section class="card" id="login"><p>Admin sign-in</p><input id="password" type="password" placeholder="Admin password"><button id="loginBtn">SIGN IN</button><p id="error"></p></section><section id="dashboard" class="hidden"><div class="row"><div class="card metric"><small>PLAYERS ONLINE NOW</small><b id="online">0</b></div><div class="card metric"><small>TOTAL REGISTERED PROFILES</small><b id="registered">0</b></div></div><div class="card"><h3>Live Players</h3><div class="tablewrap"><table><thead><tr><th>Status</th><th>Player</th><th>Player ID</th><th>Entry time</th><th>Score</th><th>Level</th><th>Car</th><th>Game position</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io();const $=id=>document.getElementById(id);let logged=false;
$('loginBtn').onclick=()=>s.emit('admin:login',$('password').value,r=>{if(!r.ok){$('error').textContent=r.message;return;}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');logged=true;render(r);});
function render(d){$('online').textContent=d.online.length;$('registered').textContent=d.registered;$('rows').innerHTML=d.online.map(p=>`<tr><td class="online">● ONLINE</td><td>${esc(p.username)}</td><td>${esc(p.id)}</td><td>${new Date(p.joinedAt).toLocaleString()}</td><td>${p.score}</td><td>${p.level}</td><td>${esc(p.car)}</td><td>${p.x.toFixed(1)}, ${p.z.toFixed(1)}</td></tr>`).join('')||'<tr><td colspan="8">No players online</td></tr>';}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
s.on('admin:players',d=>{if(logged)render(d);});
</script></body></html>
